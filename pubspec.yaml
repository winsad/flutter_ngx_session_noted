name: flutter_mobile_application
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
 
version: 1.0.0+1

environment:
  sdk: ^3.10.7 

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  slang: ^3.31.1
  slang_flutter: ^3.31.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  slang_build_runner: ^3.31.0
  build_runner: ^2.4.13
  
 
flutter: 
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/ 
    - assets/images/account_icons/ 
  
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/ubuntu/Ubuntu-Regular.ttf
          weight: 400
        - asset: assets/fonts/ubuntu/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/ubuntu/Ubuntu-Medium.ttf
          weight: 600
        - asset: assets/fonts/ubuntu/Ubuntu-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 23